worker_processes 1;
error_log /var/log/nginx/qwen-balancer-error.log warn;
pid /run/nginx-qwen.pid;

events { worker_connections 256; }

http {
    access_log /var/log/nginx/qwen-balancer-access.log;

    upstream qwen_backends {
        least_conn;
        server 127.0.0.1:18081 max_fails=2 fail_timeout=30s;
        server 127.0.0.1:18082 max_fails=2 fail_timeout=30s;
        server 127.0.0.1:18083 max_fails=2 fail_timeout=30s;
        keepalive 8;
    }

    server {
        listen 8081;
        server_name _;

        client_max_body_size 64m;

        location / {
            proxy_pass http://qwen_backends;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Connection "";

            # streaming (SSE) must not be buffered
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;

            # long generations / big prompts
            proxy_connect_timeout 30s;
            proxy_send_timeout 3600s;
            proxy_read_timeout 3600s;
        }
    }
}
